<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — Nexora Store</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="nav"><a class="brand" href="index.html">NEXORA<span>STORE</span></a><nav><a href="index.html#shop">Shop</a></nav><a class="cart" href="cart.html">Cart <b id="cart-count">0</b></a></div></header><main class="section"><p class="eyebrow">NEXORA LABS · DEMO PROJECT</p><h1>Your cart</h1><div id="cart-items"></div><div class="cart-total" id="total"></div><a class="btn" href="checkout.html">Proceed to checkout →</a></main><script src="script.js"></script><script>const all=products;const c=cart();const el=document.getElementById('cart-items');el.innerHTML=c.length?c.map(i=>{const p=all.find(x=>x.id===i.id);return `<div class="cart-row"><span>${p.icon} ${p.name} × ${i.qty}</span><strong>€${p.price*i.qty}</strong></div>`}).join(''):'<p>Your cart is empty. <a href="index.html#shop"><u>Continue shopping</u></a></p>';document.getElementById('total').textContent='Total: €'+c.reduce((s,i)=>s+(all.find(p=>p.id===i.id).price*i.qty),0).toFixed(2);updateCount();</script></body></html>
